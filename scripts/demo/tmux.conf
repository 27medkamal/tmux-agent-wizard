# tmux config for the demo recording only (scripts/demo/start.sh loads it with -f).
set -g default-command "bash --norc --noprofile"
set -g base-index 1
# A session no client has attached yet (every one but the first, until the recording goes to it) is drawn at the
# recording's size, 110 by 33 above the status line, not tmux's 80 by 24: the popup's preview shows such a pane as it
# is, and at 24 rows it would sit under six empty rows, the stand-in's screen cut down to fit them.
set -g default-size 110x33
setw -g pane-base-index 0
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set -g mouse on
set -g escape-time 0
set -g display-time 2500

# The look: a quiet status line at the bottom on the terminal's own background, the session in blue,
# window tabs in brackets (the current one in magenta), each with a small Nerd Font icon in the style of
# tmux-nerd-font-window-name (a robot for an agent's window, a terminal for a shell, node for a dev server),
# and taw's own summary on the right.
set -g status-position bottom
set -g status-style "bg=default,fg=white"
set -g status-left "#[fg=blue,bold]#S #[fg=white,nobold]"
set -g status-left-length 30
set -g @demo_icon "#{?#{@agent_kind_hint},󰚩,#{?#{==:#{pane_current_command},node},,}}"
set -g window-status-format "#[fg=brightblack,nobold,bg=default][ #[fg=brightblack,bg=default]#I #[fg=gray,bg=default]#{E:@demo_icon} #W#[fg=brightblack,nobold,bg=default] ]"
set -g window-status-current-format "#[fg=magenta,nobold,bg=default][ #[fg=magenta,nobold,bg=default]#I #[fg=magenta,bold,bg=default]#{E:@demo_icon} #W#[fg=magenta,nobold,bg=default] ]"
set -g window-status-separator " "
# No underline or reverse on any tab: the brackets and the colours say which is current.
set -g window-status-style "default"
set -g window-status-current-style "default"
set -g window-status-activity-style "default"
set -g window-status-bell-style "default"
set -g status-right "#{@agent_wizard_status} "
set -g status-right-length 80

# One pane per window, so no border status line; the borders keep the config's colours.
set -g pane-active-border-style "fg=magenta,bg=default"
set -g pane-border-style "fg=brightblack,bg=default"

# taw's popup covers the whole window above the status line (100 percent of each side), so nothing of the pane
# under it shows at its edges. taw draws a full-size popup with no frame or title of its own (the bar names it),
# at the terminal's own colours: tmux 3.8 draws a popup grey unless popup-style names fg=terminal, and taw passes
# that itself. The border options below only show once a cap drops below 100, so the demo leaves them out.
set -g @agent-wizard-width 100
set -g @agent-wizard-height 100

# The toast: bold yellow on the terminal's background, the only yellow on the status line, so it reads as news.
# Its own ✓ and ⏸ keep their colours on the dark ground. make-gif.py finds it by that yellow to highlight it.
set -g message-style "bg=default,fg=#f9e2af,bold"
