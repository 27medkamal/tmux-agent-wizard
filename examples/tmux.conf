# tmux-agent-wizard: minimal setup
#
# Add these lines to your tmux.conf (wherever you list TPM plugins), then either
# reload tmux (`tmux source-file ~/.tmux.conf`) or press `prefix + I` to have TPM
# fetch and install it. The first load downloads the taw binary for this machine;
# to build it yourself instead, see the README (`scripts/install.sh`).

set -g @plugin '27medkamal/tmux-agent-wizard'

# --- Options (all optional; these are the plugin's own built-in defaults) ---

set -g @agent-wizard "A"                    # prefix+A opens the popup
set -g @agent-wizard-notification-key "O"   # prefix+O goes next up (who to deal with next)
# set -g @agent-wizard-clear-key "C-k"      # prefix+C-k clears the pane: its history, and its screen at a shell prompt (unbound by default)
set -g @agent-wizard-watch "on"             # "off" disables auto-attaching watchers
set -g @agent-wizard-auto-install "on"      # "off": never download taw, you build it yourself

# Height and width are CAPS in percent, not sizes: `taw ui open` places a full-width
# popup one row short of the client, against the status line, so the status line stays
# visible and a toast still lands in it. Lower a cap to shrink the popup; it stays
# centred and still adjacent to the status line.

set -g @agent-wizard-height "100"           # cap on popup height, percent of the client
set -g @agent-wizard-width "100"            # cap on popup width, percent of the client
set -g @agent-wizard-popup-title " taw "    # display-popup -T
# set -g @agent-wizard-popup-border "rounded" # display-popup -b; needs tmux >= 3.3

# --- tmux behaviour that pairs well with taw (optional) ---
#
# When you close the session you are attached to (the popup's `x` on a session
# header, or a plain `kill-session`), tmux by default detaches the client, which
# closes your terminal. `detach-on-destroy off` tells tmux to switch you to another
# session instead, so closing a session from inside it keeps you in tmux. This is a
# stock tmux option, not a taw feature.

set -g detach-on-destroy off

# --- Status line (opt-in) ---
#
# taw never edits status-left/status-right itself (it never modifies
# the user's status line). Add this token yourself wherever you want the compact
# per-state agent count; see examples/status-line.md for two more placements
# (a per-pane pane-border token, and a dedicated second status row).

set -ag status-right ' #{@agent_wizard_status}'

# Initialize TPM (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
